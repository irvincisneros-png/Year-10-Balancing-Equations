// localStorage shim — drop-in replacement for window.storage so the original code is unchanged
window.storage = {
  async get(key) {
    const v = localStorage.getItem(key);
    if (v === null) throw new Error('Key not found: ' + key);
    return { key, value: v };
  },
  async set(key, value) {
    localStorage.setItem(key, value);
    return { key, value };
  },
  async delete(key) {
    localStorage.removeItem(key);
    return { key, deleted: true };
  },
  async list(prefix = '') {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(prefix)) keys.push(k);
    }
    return { keys, prefix };
  },
};

    { r: [{ f: 'C₄H₁₀', c: 2 }, { f: 'O₂', c: 13 }], p: [{ f: 'CO₂', c: 8 }, { f: 'H₂O', c: 10 }] },
  ],
};

// =================== HELPERS ===================
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const SUB = { '₀': 0, '₁': 1, '₂': 2, '₃': 3, '₄': 4, '₅': 5, '₆': 6, '₇': 7, '₈': 8, '₉': 9 };
function readNum(s, i) {
  let n = '';
  while (i < s.length && (SUB[s[i]] !== undefined || /\d/.test(s[i]))) {
    n += SUB[s[i]] !== undefined ? SUB[s[i]] : s[i];
    i++;
  }
  return [n === '' ? 1 : parseInt(n), i];
}

function parseFormula(formula) {
  const result = {};
  function parseSeg(s, mult) {
    let i = 0;
    while (i < s.length) {
      if (s[i] === '(') {
        let depth = 1, j = i + 1;
        while (j < s.length && depth > 0) {
          if (s[j] === '(') depth++;
          else if (s[j] === ')') depth--;
          if (depth > 0) j++;
        }
        const inner = s.slice(i + 1, j);
        i = j + 1;
        const [n, ni] = readNum(s, i);
        i = ni;
        const sub = {};
        parseSegInto(inner, sub);
        for (const [el, c] of Object.entries(sub)) {
          result[el] = (result[el] || 0) + c * n * mult;
        }
      } else if (/[A-Z]/.test(s[i])) {
        let el = s[i++];
        if (i < s.length && /[a-z]/.test(s[i])) el += s[i++];
        const [n, ni] = readNum(s, i);
        i = ni;
        result[el] = (result[el] || 0) + n * mult;
      } else { i++; }
    }
  }
  function parseSegInto(s, target) {
    let i = 0;
    while (i < s.length) {
      if (s[i] === '(') {
        let depth = 1, j = i + 1;
        while (j < s.length && depth > 0) {
          if (s[j] === '(') depth++;
          else if (s[j] === ')') depth--;
          if (depth > 0) j++;
        }
        const inner = s.slice(i + 1, j);
        i = j + 1;
        const [n, ni] = readNum(s, i);
        i = ni;
        const sub = {};
        parseSegInto(inner, sub);
        for (const [el, c] of Object.entries(sub)) {
          target[el] = (target[el] || 0) + c * n;
        }
      } else if (/[A-Z]/.test(s[i])) {
        let el = s[i++];
        if (i < s.length && /[a-z]/.test(s[i])) el += s[i++];
        const [n, ni] = readNum(s, i);
        i = ni;
        target[el] = (target[el] || 0) + n;
      } else { i++; }
    }
  }
  parseSeg(formula, 1);
  return result;
}

function atomCount(side) {
  const tot = {};
  for (const m of side) {
    const parsed = parseFormula(m.f);
    for (const [el, c] of Object.entries(parsed)) {
      tot[el] = (tot[el] || 0) + c * m.c;
    }
  }
  return tot;
}

function isBalanced(reactants, products) {
  const r = atomCount(reactants), p = atomCount(products);
  const allEls = new Set([...Object.keys(r), ...Object.keys(p)]);
  for (const el of allEls) if ((r[el] || 0) !== (p[el] || 0)) return false;
  return true;
}

// =================== SPRITE COMPONENT ===================
function Sprite({ char, expression = 'neutral', size = 160 }) {
  if (!char) return null;
  const skin = SKIN_OPTIONS.find(s => s.id === char.skin) || SKIN_OPTIONS[0];
  const hair = HAIR_OPTIONS.find(h => h.id === char.hairColor) || HAIR_OPTIONS[0];
  const eye = EYE_OPTIONS.find(e => e.id === char.eyeColor) || EYE_OPTIONS[0];
  const outfit = OUTFIT_COLORS.find(o => o.id === char.outfitColor) || OUTFIT_COLORS[0];
  const accColors = { glasses: '#1a1a25', goggles: '#3ef0ff', headphones: '#d83a3a', beanie: '#ff3ea5' };

  const colorMap = {
    s: skin.color, h: hair.color, o: outfit.main, a: outfit.accent,
    g: accColors[char.accessory] || '#1a1a25', b: accColors.beanie,
  };

  const layers = [
    SKIN, OUTFITS[char.outfit] || OUTFITS.tee, HAIR_STYLES[char.hair] || HAIR_STYLES.short,
  ];
  if (char.accessory && char.accessory !== 'none') layers.push(ACCESSORIES[char.accessory]);

  const cell = size / GRID_W;
  const rects = [];
  let key = 0;
  layers.forEach(layer => {
    if (!layer) return;
    layer.forEach((row, y) => {
      for (let x = 0; x < row.length; x++) {
        const ch = row[x];
        if (ch === ' ') continue;
        const color = colorMap[ch];
        if (!color) continue;
        rects.push(<rect key={key++} x={x * cell} y={y * cell} width={cell} height={cell} fill={color} />);
      }
    });
  });

  // Eyes
  const expr = EXPRESSIONS[expression] || EXPRESSIONS.neutral;
  const eyeStyle = expression === 'shocked' ? 'wide' : (expression === 'sad' ? 'closed' : (char.eyes || 'round'));
  const eyeY = 6 * cell;
  if (eyeStyle === 'closed') {
    rects.push(<rect key={key++} x={6 * cell} y={eyeY + cell * 0.3} width={cell * 1.2} height={cell * 0.3} fill="#1a1a25" />);
    rects.push(<rect key={key++} x={9 * cell} y={eyeY + cell * 0.3} width={cell * 1.2} height={cell * 0.3} fill="#1a1a25" />);
  } else if (eyeStyle === 'wide') {
    rects.push(<rect key={key++} x={6 * cell} y={eyeY} width={cell * 1.2} height={cell * 1.2} fill={eye.color} />);
    rects.push(<rect key={key++} x={9 * cell} y={eyeY} width={cell * 1.2} height={cell * 1.2} fill={eye.color} />);
    rects.push(<rect key={key++} x={6.3 * cell} y={eyeY + 0.3 * cell} width={cell * 0.4} height={cell * 0.4} fill="#fff" />);
    rects.push(<rect key={key++} x={9.3 * cell} y={eyeY + 0.3 * cell} width={cell * 0.4} height={cell * 0.4} fill="#fff" />);
  } else if (eyeStyle === 'sharp') {
    rects.push(<rect key={key++} x={6 * cell} y={eyeY + 0.4 * cell} width={cell * 1.2} height={cell * 0.5} fill={eye.color} />);
    rects.push(<rect key={key++} x={9 * cell} y={eyeY + 0.4 * cell} width={cell * 1.2} height={cell * 0.5} fill={eye.color} />);
  } else {
    rects.push(<rect key={key++} x={6 * cell} y={eyeY} width={cell} height={cell} fill={eye.color} />);
    rects.push(<rect key={key++} x={9 * cell} y={eyeY} width={cell} height={cell} fill={eye.color} />);
    rects.push(<rect key={key++} x={6.2 * cell} y={eyeY + 0.2 * cell} width={cell * 0.3} height={cell * 0.3} fill="#fff" />);
    rects.push(<rect key={key++} x={9.2 * cell} y={eyeY + 0.2 * cell} width={cell * 0.3} height={cell * 0.3} fill="#fff" />);
  }

  // Mouth
  const mY = 8.5 * cell;
  if (expr.mouth === 'smile') {
    rects.push(<rect key={key++} x={7 * cell} y={mY} width={cell * 2} height={cell * 0.4} fill="#7a2020" />);
    rects.push(<rect key={key++} x={6.5 * cell} y={mY - 0.2 * cell} width={cell * 0.5} height={cell * 0.5} fill="#7a2020" />);
    rects.push(<rect key={key++} x={9 * cell} y={mY - 0.2 * cell} width={cell * 0.5} height={cell * 0.5} fill="#7a2020" />);
  } else if (expr.mouth === 'bigsmile') {
    rects.push(<rect key={key++} x={6.5 * cell} y={mY} width={cell * 3} height={cell * 0.6} fill="#7a2020" />);
    rects.push(<rect key={key++} x={7 * cell} y={mY + 0.5 * cell} width={cell * 2} height={cell * 0.3} fill="#fff" />);
  } else if (expr.mouth === 'o') {
    rects.push(<rect key={key++} x={7.5 * cell} y={mY} width={cell} height={cell * 0.8} fill="#7a2020" />);
  } else if (expr.mouth === 'frown') {
    rects.push(<rect key={key++} x={7 * cell} y={mY + 0.3 * cell} width={cell * 2} height={cell * 0.4} fill="#7a2020" />);
    rects.push(<rect key={key++} x={6.5 * cell} y={mY} width={cell * 0.5} height={cell * 0.5} fill="#7a2020" />);
    rects.push(<rect key={key++} x={9 * cell} y={mY} width={cell * 0.5} height={cell * 0.5} fill="#7a2020" />);
  } else {
    rects.push(<rect key={key++} x={7 * cell} y={mY + 0.2 * cell} width={cell * 2} height={cell * 0.3} fill="#7a2020" />);
  }

  return (
    <svg width={size} height={size * GRID_H / GRID_W} viewBox={`0 0 ${size} ${size * GRID_H / GRID_W}`}
      style={{ imageRendering: 'pixelated', shapeRendering: 'crispEdges' }}>
      {rects}
    </svg>
  );
}

function PixelButton({ children, onClick, color = PALETTE.pink, disabled, small, full, style }) {

    <button onClick={onClick} disabled={disabled}
      style={{

        textTransform: 'uppercase',
        letterSpacing: 1,
        width: full ? '100%' : 'auto',

                      display: 'flex', justifyContent: 'space-between', alignItems: 'center',
                      background: PALETTE.bg2, color: PALETTE.ink, border: `2px solid ${PALETTE.bg}`,
                      padding: 10, cursor: 'pointer', fontFamily: PIX_FONT, fontSize: 9, textAlign: 'left',
                    }}>
                    <span>{li + 1}. {lv}</span>
                    <StarRow stars={progress[li] || 0} />
                  </button>
                ))}
              </div>
            )}
          </div>
        );
      })}

      <div style={{ display: 'flex', justifyContent: 'center', marginTop: 16 }}>
        <PixelButton onClick={onTitle} color={PALETTE.dim} small>← Title</PixelButton>
      </div>
    </div>
  );
}

const WORLD_PALETTES = {
  ionic:    { primary: PALETTE.cyan,  monsters: ['#3ef0ff', '#5599ff', '#00d4d4', '#7ee0ff', '#3a8cff'] },
  covalent: { primary: PALETTE.green, monsters: ['#3eff8a', '#aaff44', '#00cc77', '#88dd55', '#5fe0a8'] },
  equation: { primary: PALETTE.pink,  monsters: ['#ff3ea5', '#ff5577', '#dd2299', '#aa44dd', '#ff7766'] },
};

const MONSTER_SHAPES = ['orb', 'cube', 'diamond', 'spike', 'jagged'];
const MONSTER_EYES = ['normal', 'slit', 'cyclops', 'angry', 'triple'];

function generateMonster(isBoss, palette, seed) {
  // deterministic pick from seed
  const pick = (arr, n) => arr[Math.abs((seed * 31 + n)) % arr.length];
  if (isBoss) {
    return {
      type: pick(['jagged', 'spike', 'diamond'], 7),
      eyes: 'triple',
      color: palette.monsters[0],
      isBoss: true,
    };
  }
  return {
    type: pick(MONSTER_SHAPES, 1),
    eyes: pick(MONSTER_EYES, 2),
    color: pick(palette.monsters, 3),
    isBoss: false,
  };
}

function Monster({ type = 'orb', eyes = 'normal', color, isBoss = false, phase, hidden }) {
  if (hidden) return null;
  const baseSize = isBoss ? 76 : 56;
  const animation =
    phase === 'hurt' ? 'monsterShake 0.4s' :
    phase === 'victory' ? 'monsterDestroy 0.6s forwards' :
    'monsterFloat 2.5s infinite';

  // Shape rendering — clip-path shapes need drop-shadow filter (box-shadow doesn't follow clip)
  let bodyStyle = {
    width: baseSize, height: baseSize, background: color, position: 'relative',
    border: `3px solid ${PALETTE.bg}`,
    boxShadow: `0 0 ${isBoss ? 24 : 16}px ${color}, inset -8px -8px 0 rgba(0,0,0,.35)`,
  };
  let needsFilterShadow = false;

  if (type === 'orb') {
    bodyStyle.borderRadius = '50%';
  } else if (type === 'cube') {
    bodyStyle.borderRadius = 4;
  } else if (type === 'diamond') {
    bodyStyle.borderRadius = 4;
    bodyStyle.transform = 'rotate(45deg)';
  } else if (type === 'spike') {
    bodyStyle.clipPath = 'polygon(50% 0%, 0% 100%, 100% 100%)';
    bodyStyle.border = 'none';
    bodyStyle.boxShadow = 'none';
    needsFilterShadow = true;
  } else if (type === 'jagged') {
    bodyStyle.clipPath = 'polygon(50% 0%, 78% 12%, 100% 35%, 88% 65%, 100% 100%, 65% 88%, 35% 100%, 12% 80%, 0% 50%, 15% 22%, 30% 12%)';
    bodyStyle.border = 'none';
    bodyStyle.boxShadow = 'none';
    needsFilterShadow = true;
  }

  // Eyes are positioned relative to monster body — use percentages for shape independence
  const eyeBg = '#fff';
  const pupilBg = PALETTE.bg;
  const eyeRadius = type === 'orb' ? '50%' : 0;
  const eyeY = type === 'spike' ? '52%' : (type === 'jagged' ? '36%' : '30%');

  let eyeJSX;
  if (eyes === 'cyclops') {
    eyeJSX = (
      <div style={{ position: 'absolute', top: eyeY, left: '50%', transform: 'translateX(-50%)',
        width: '28%', height: '28%', background: eyeBg, border: `2px solid ${PALETTE.bg}`, borderRadius: eyeRadius }}>
        <div style={{ position: 'absolute', bottom: '8%', left: '50%', transform: 'translateX(-50%)',
          width: '40%', height: '50%', background: pupilBg, borderRadius: eyeRadius }} />
      </div>
    );
  } else if (eyes === 'slit') {
    eyeJSX = (<>
      <div style={{ position: 'absolute', top: eyeY, left: '20%', width: '20%', height: '6%',
        background: pupilBg, border: `1px solid #fff` }} />
      <div style={{ position: 'absolute', top: eyeY, right: '20%', width: '20%', height: '6%',
        background: pupilBg, border: `1px solid #fff` }} />
    </>);
  } else if (eyes === 'angry') {
    eyeJSX = (<>
      <div style={{ position: 'absolute', top: eyeY, left: '18%', width: '20%', height: '22%',
        background: eyeBg, border: `2px solid ${PALETTE.bg}`, borderRadius: eyeRadius, transform: 'rotate(-15deg)' }}>
        <div style={{ position: 'absolute', bottom: '10%', left: '15%', width: '40%', height: '40%', background: pupilBg, borderRadius: eyeRadius }} />
      </div>
      <div style={{ position: 'absolute', top: eyeY, right: '18%', width: '20%', height: '22%',
        background: eyeBg, border: `2px solid ${PALETTE.bg}`, borderRadius: eyeRadius, transform: 'rotate(15deg)' }}>
        <div style={{ position: 'absolute', bottom: '10%', right: '15%', width: '40%', height: '40%', background: pupilBg, borderRadius: eyeRadius }} />
      </div>
    </>);
  } else if (eyes === 'triple') {
    eyeJSX = (<>
      <div style={{ position: 'absolute', top: '14%', left: '50%', transform: 'translateX(-50%)',
        width: '18%', height: '20%', background: eyeBg, border: `2px solid ${PALETTE.bg}`, borderRadius: '50%' }}>
        <div style={{ position: 'absolute', bottom: 1, left: '50%', transform: 'translateX(-50%)', width: 3, height: 5, background: pupilBg, borderRadius: '50%' }} />
      </div>
      <div style={{ position: 'absolute', top: '44%', left: '20%', width: '18%', height: '20%',
        background: eyeBg, border: `2px solid ${PALETTE.bg}`, borderRadius: '50%' }}>
        <div style={{ position: 'absolute', bottom: 1, left: '50%', transform: 'translateX(-50%)', width: 3, height: 5, background: pupilBg, borderRadius: '50%' }} />
      </div>
      <div style={{ position: 'absolute', top: '44%', right: '20%', width: '18%', height: '20%',
        background: eyeBg, border: `2px solid ${PALETTE.bg}`, borderRadius: '50%' }}>
        <div style={{ position: 'absolute', bottom: 1, left: '50%', transform: 'translateX(-50%)', width: 3, height: 5, background: pupilBg, borderRadius: '50%' }} />
      </div>
    </>);
  } else {
    eyeJSX = (<>
      <div style={{ position: 'absolute', top: eyeY, left: '18%', width: '20%', height: '22%',
        background: eyeBg, border: `2px solid ${PALETTE.bg}`, borderRadius: eyeRadius }}>
        <div style={{ position: 'absolute', bottom: 1, left: 1, width: 4, height: 6, background: pupilBg }} />
      </div>
      <div style={{ position: 'absolute', top: eyeY, right: '18%', width: '20%', height: '22%',
        background: eyeBg, border: `2px solid ${PALETTE.bg}`, borderRadius: eyeRadius }}>
        <div style={{ position: 'absolute', bottom: 1, left: 1, width: 4, height: 6, background: pupilBg }} />
      </div>
    </>);
  }

  const mouth = type !== 'spike' ? (
    <div style={{ position: 'absolute', bottom: type === 'jagged' ? '20%' : '15%', left: '50%',
      transform: 'translateX(-50%)', width: '32%', height: '10%',
      background: PALETTE.bg, borderTop: `2px solid #fff` }} />
  ) : null;

  return (
    <div style={{ position: 'relative', display: 'inline-block',
      animation, filter: needsFilterShadow ? `drop-shadow(0 0 ${isBoss ? 12 : 8}px ${color})` : 'none' }}>
      {/* Q mark or BOSS label */}
      {!isBoss ? (
        <div style={{ position: 'absolute', top: -22, left: '50%', transform: 'translateX(-50%)',
          fontFamily: PIX_FONT, fontSize: 14, color: PALETTE.yellow,
          textShadow: `0 0 6px ${PALETTE.yellow}`, zIndex: 2 }}>?</div>
      ) : (
        <div style={{ position: 'absolute', top: -28, left: '50%', transform: 'translateX(-50%)',
          background: PALETTE.red, color: '#fff', padding: '3px 10px', fontFamily: PIX_FONT, fontSize: 9,
          border: `2px solid ${PALETTE.bg}`, whiteSpace: 'nowrap', zIndex: 2,
          boxShadow: `0 0 8px ${PALETTE.red}`, letterSpacing: 1 }}>BOSS</div>
      )}
      {/* Boss spikes/horns */}
      {isBoss && [0.2, 0.5, 0.8].map(p => (
        <div key={p} style={{
          position: 'absolute', top: -6, left: `${p * 100}%`, transform: 'translateX(-50%)',
          width: 0, height: 0, borderLeft: '6px solid transparent', borderRight: '6px solid transparent',
          borderBottom: `14px solid ${color}`, zIndex: 1,
          filter: `drop-shadow(0 0 4px ${color})`,
        }} />
      ))}
      <div style={bodyStyle}>
        {/* Counter-rotate inner content for diamond */}
        <div style={type === 'diamond' ? { transform: 'rotate(-45deg)', width: '100%', height: '100%' } : { width: '100%', height: '100%' }}>
          {eyeJSX}
          {mouth}
        </div>
      </div>
    </div>
  );
}

function AttackEffect({ tier }) {
  if (tier === 0) return <Slash />;
  if (tier === 1) return <DoubleSlash />;

  if (tier === 3) return <Beam color="#3ef0ff" thickness={6} />;
  if (tier === 4) return <Beam color="#ff3030" thickness={10} />;
  if (tier === 5) return <SuperFireball />;
  if (tier === 6) return <Meteor />;
  return null; // tier 7 handled by UltimateSequence
}

// =================== ULTIMATE SEQUENCE (Tier 7) ===================
function UltimateSequence({ char, monster, accentColor }) {
  const [stage, setStage] = useState(0);
  // 0: teleport flash (300ms)
  // 1: black + shake (1500ms)
  // 2: reveal — char on right, monster cut in 4 (400ms hold)
  // 3: pieces fly + disintegrate (1000ms)

  useEffect(() => {
    const t1 = setTimeout(() => setStage(1), 300);
    const t2 = setTimeout(() => setStage(2), 1800);
    const t3 = setTimeout(() => setStage(3), 2200);
    return () => { clearTimeout(t1); clearTimeout(t2); clearTimeout(t3); };
  }, []);

  const monsterColor = monster?.color || accentColor;

  return (
    <div style={{ position: 'absolute', inset: 0, overflow: 'hidden' }}>
      {/* Stage 0: char teleporting out at original position */}
      {stage === 0 && (
        <div style={{
          position: 'absolute', bottom: 12, left: '12%',
          animation: 'teleportOut 0.3s forwards',
        }}>
          <Sprite char={char} expression="thrilled" size={64} />
        </div>
      )}

      {/* Black overlay with shake */}
      {stage === 1 && (<>
        <div style={{
          position: 'absolute', inset: 0, background: '#000', zIndex: 5,
          animation: 'screenShake 0.12s linear infinite',
        }} />
        {/* Streak lines flickering across */}
        {[0, 1, 2, 3].map(i => (
          <div key={i} style={{
            position: 'absolute', left: 0, right: 0,
            top: `${20 + i * 18}%`, height: 1, background: '#fff',
            opacity: 0.3, zIndex: 6,
            animation: `streakFlash 0.3s ${i * 80}ms infinite`,
          }} />
        ))}
      </>)}

      {/* Stage 2+: char appears on right with sword sheathing */}
      {stage >= 2 && (
        <div style={{ position: 'absolute', bottom: 12, right: '10%', zIndex: 4 }}>
          <Sprite char={char} expression="thrilled" size={64} />
          {/* sword animation - line that "slides into" sheath */}
          <div style={{
            position: 'absolute', top: 16, right: 50,
            width: 40, height: 4, background: '#e8e8ff',
            boxShadow: `0 0 8px #fff, 0 0 16px ${accentColor}`,
            animation: stage === 2 ? 'swordSheath 0.6s forwards' : 'none',
            opacity: stage === 3 ? 0 : 1,
          }} />
        </div>
      )}

      {/* Stage 2+: monster sliced into 4 pieces */}
      {stage >= 2 && monster && (
        <div style={{ position: 'absolute', bottom: 30, right: '24%', width: 76, height: 76 }}>
          {[
            { dx: -1, dy: -1, clip: 'polygon(0 0, 50% 0, 50% 50%, 0 50%)' },
            { dx: 1, dy: -1, clip: 'polygon(50% 0, 100% 0, 100% 50%, 50% 50%)' },
            { dx: -1, dy: 1, clip: 'polygon(0 50%, 50% 50%, 50% 100%, 0 100%)' },
            { dx: 1, dy: 1, clip: 'polygon(50% 50%, 100% 50%, 100% 100%, 50% 100%)' },
          ].map((piece, i) => (
            <div key={i} style={{
              position: 'absolute', inset: 0,
              clipPath: piece.clip,
              animation: stage === 3 ? `cutFly 1s forwards` : 'none',
              '--dx': `${piece.dx * 50}px`,
              '--dy': `${piece.dy * 30 - 10}px`,
              '--rot': `${piece.dx * 90}deg`,
            }}>
              <div style={{
                width: '100%', height: '100%',
                background: monsterColor,
                border: `3px solid ${PALETTE.bg}`,
                boxShadow: `0 0 12px ${monsterColor}`,
              }} />
            </div>
          ))}
          {/* Cut lines (cross shape) */}
          {stage === 2 && (<>
            <div style={{ position: 'absolute', top: 0, bottom: 0, left: '50%', width: 2,
              background: '#fff', boxShadow: `0 0 8px #fff`,
              animation: 'cutLineFlash 0.4s forwards' }} />
            <div style={{ position: 'absolute', left: 0, right: 0, top: '50%', height: 2,
              background: '#fff', boxShadow: `0 0 8px #fff`,
              animation: 'cutLineFlash 0.4s forwards' }} />
          </>)}
        </div>
      )}

      {/* Ultimate label */}
      {stage >= 1 && stage <= 2 && (
        <div style={{ position: 'absolute', top: 8, left: '50%', transform: 'translateX(-50%)',
          color: PALETTE.yellow, fontFamily: PIX_FONT, fontSize: 14,
          textShadow: `0 0 12px ${PALETTE.yellow}, 0 0 24px ${PALETTE.red}`,
          letterSpacing: 2, zIndex: 10,
          animation: 'ultimateLabel 0.5s forwards',
        }}>★ ULTIMATE ★</div>
      )}
    </div>
  );
}

function BattleScene({ char, phase, monster, attackTier = 0, accentColor = PALETTE.cyan }) {
  // For tier 7 + correct, the entire sequence is dramatized differently
  const inUltimate = attackTier === 7 && (phase === 'attacking' || phase === 'victory');

  const expression =
    phase === 'victory' || phase === 'attacking' ? 'thrilled' :
    phase === 'hurt' ? 'sad' : 'happy';

  const charAnim =
    phase === 'walking' ? 'walkIn 0.6s ease-out forwards, walkBounce 0.4s 0.6s infinite' :
    phase === 'attacking' ? 'attackLunge 0.6s forwards' :
    phase === 'victory' ? 'walkAway 0.7s 0.4s forwards, walkBounce 0.4s infinite' :
    phase === 'hurt' ? 'hurtBounce 0.6s forwards' :
    'walkBounce 0.5s infinite';

  return (
    <div style={{
      position: 'relative', height: 150, marginTop: 12,
      background: `linear-gradient(180deg, ${PALETTE.bg} 0%, ${PALETTE.bg2} 100%)`,
      border: `3px solid ${PALETTE.bg}`, overflow: 'hidden',
    }}>
      {/* Stars */}
      {[7, 23, 41, 58, 71, 88, 14, 32, 49, 66, 83, 96, 19, 36, 53, 78].map((x, i) => (
        <div key={i} style={{
          position: 'absolute', left: `${x}%`, top: `${(i * 13) % 65 + 5}%`,
          width: 2, height: 2, background: '#fff', opacity: 0.4,
        }} />
      ))}

      {/* Ground */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0, height: 14,
        background: `repeating-linear-gradient(90deg, ${PALETTE.dim} 0 8px, transparent 8px 16px)`,
        borderTop: `2px solid ${accentColor}`,
        boxShadow: `0 -2px 8px ${accentColor}`,
      }} />

      {/* Normal scene (hidden during ultimate) */}
      {!inUltimate && (<>
        {/* Character */}
        <div key={phase} style={{
          position: 'absolute', bottom: 12, left: '12%',
          animation: charAnim,
        }}>
          <Sprite char={char} expression={expression} size={64} />
        </div>

        {/* Monster */}
        {phase !== 'victory' && monster && (
          <div style={{ position: 'absolute', bottom: 30, right: '22%' }}>
            <Monster {...monster} phase={phase} />
          </div>
        )}

        {/* Attack effect during attack phase */}
        {phase === 'attacking' && <AttackEffect tier={attackTier} />}

        {/* Particle burst on victory */}
        {phase === 'victory' && monster && (
          <div style={{ position: 'absolute', bottom: 56, right: 'calc(22% + 28px)', width: 0, height: 0 }}>
            {[0, 45, 90, 135, 180, 225, 270, 315].map(deg => (
              <div key={deg} style={{
                position: 'absolute', width: 8, height: 8, background: monster.color,
                boxShadow: `0 0 8px ${monster.color}`,
                animation: 'particleBurst 0.7s forwards',
                transformOrigin: '0 0', transform: `rotate(${deg}deg) translateX(0)`,
                '--deg': `${deg}deg`,
              }} />
            ))}
          </div>
        )}
      </>)}

      {/* Ultimate sequence overlay */}
      {inUltimate && (
        <UltimateSequence char={char} monster={monster} accentColor={accentColor} />
      )}
    </div>
  );
}

function useArenaPhase(qi, feedback, attackTier) {
  const [phase, setPhase] = useState('walking');
  useEffect(() => {
    setPhase('walking');
    const t = setTimeout(() => setPhase('idle'), 700);
    return () => clearTimeout(t);
  }, [qi]);
  useEffect(() => {
    if (!feedback) return;
    setPhase('attacking');
    // Tier 7 needs longer attacking phase since the teleport happens during attack
    const attackDuration = attackTier === 7 ? 300 : 500;
    const t = setTimeout(() => {
      setPhase(feedback.type === 'correct' ? 'victory' : 'hurt');
    }, attackDuration);
    return () => clearTimeout(t);
  }, [feedback, attackTier]);
  return phase;
}

// =================== IONIC GAME ===================
function IonicGame({ char, level, onWin, onQuit, refOpen, setRefOpen }) {
  const pool = [IONIC.binary, IONIC.transition, IONIC.polyatomic][level];
  const startLives = char.charClass === 'strategist' ? 4 : 3;
  const [questions] = useState(() => shuffle(pool).slice(0, Math.min(8, pool.length)));
  const [qi, setQi] = useState(0);
  const [lives, setLives] = useState(startLives);
  const [score, setScore] = useState(0);
  const [streak, setStreak] = useState(0);
  const [feedback, setFeedback] = useState(null);
  const [picked, setPicked] = useState({ cat: null, an: null });
  const [eliminated, setEliminated] = useState(null);
  const [attackTier, setAttackTier] = useState(0);

  const q = questions[qi];
  const arenaPhase = useArenaPhase(qi, feedback, attackTier);
  // alternate build / name modes
  const mode = qi % 2 === 0 ? 'build' : 'name';

  // Generate a monster per question (last question is the boss)
  const monsters = React.useMemo(() =>
    questions.map((_, i) => generateMonster(i === questions.length - 1, WORLD_PALETTES.ionic, i + level * 100))
  , [questions, level]);
  const monster = monsters[qi];

  // Build distractors for "name it"
  const nameOptions = React.useMemo(() => {
    if (!q) return [];
    const others = pool.filter(x => x.n !== q.n);
    const distractors = shuffle(others).slice(0, 3).map(o => o.n);
    return shuffle([q.n, ...distractors]);
  }, [qi]);

  // Build "Build it" tile pool — guarantee correct cat/an are included
  const tilePool = React.useMemo(() => {
    if (!q) return { cats: [], ans: [] };
    const otherCats = [...new Set(pool.filter(o => o.cat.sym !== q.cat.sym).map(o => o.cat.sym))];
    const otherAns = [...new Set(pool.filter(o => o.an.sym !== q.an.sym).map(o => o.an.sym))];
    const cats = shuffle([q.cat.sym, ...shuffle(otherCats).slice(0, 3)]);
    const ans = shuffle([q.an.sym, ...shuffle(otherAns).slice(0, 3)]);
    return { cats, ans };
  }, [qi]);

  // Scholar perk: eliminate a wrong option in name mode
  useEffect(() => {
    if (mode === 'name' && char.charClass === 'scholar') {
      const wrongs = nameOptions.filter(o => o !== q.n);
      setEliminated(wrongs[0]);
    } else {
      setEliminated(null);
    }
    setPicked({ cat: null, an: null });
    setFeedback(null);
  }, [qi]);

  if (!q) return null;

  const handleAnswer = (correct) => {
    setAttackTier(Math.min(streak, 7));
    if (correct) {
      let pts = 100 + streak * 10;
      if (mode === 'build' && char.charClass === 'alchemist') pts = Math.round(pts * 1.1);
      if (mode === 'name' && char.charClass === 'scholar') pts = Math.round(pts * 1.1);
      setScore(s => s + pts);
      setStreak(s => s + 1);
      setFeedback({ type: 'correct', pts });
    } else {
      setLives(l => l - 1);
      setStreak(0);
      setFeedback({ type: 'wrong', answer: q.n });
    }
  };

  const next = () => {
    if (lives <= 0) { onWin({ won: false, score, streak }); return; }
    if (qi + 1 >= questions.length) {
      onWin({ won: true, score, streak });
    } else {
      setQi(qi + 1);
      setFeedback(null);
    }
  };

  const handleBuildSubmit = () => {
    if (!picked.cat || !picked.an) return;
    handleAnswer(picked.cat === q.cat.sym && picked.an === q.an.sym);
  };

  return (
    <div style={{ minHeight: '100vh', padding: 10, paddingBottom: 80 }}>
      <GameHud char={char} lives={lives} maxLives={startLives} score={score} streak={streak}
        onQuit={() => onWin({ won: false, score, streak, quit: true })}
        onRef={() => setRefOpen(true)} />

      <PixelPanel style={{ marginBottom: 10, background: PALETTE.bg2 }}>
        <div style={{ fontSize: 9, color: PALETTE.cyan, marginBottom: 8 }}>
          Q{qi + 1}/{questions.length} · {mode === 'build' ? '🛠️ BUILD IT' : '📛 NAME IT'}
        </div>
        {mode === 'build' ? (
          <div>
            <div style={{ fontSize: 9, color: PALETTE.dim, marginBottom: 4 }}>Build the formula for:</div>
            <NeonText color={PALETTE.yellow} size={18}>{q.n}</NeonText>
            {q.roman && <div style={{ fontSize: 9, color: PALETTE.pink, marginTop: 4 }}>(Roman numeral = charge)</div>}
          </div>
        ) : (
          <div>
            <div style={{ fontSize: 9, color: PALETTE.dim, marginBottom: 4 }}>What is the name of:</div>
            <NeonText color={PALETTE.yellow} size={28}>{q.f}</NeonText>
          </div>
        )}
      </PixelPanel>

      {!feedback && mode === 'build' && (
        <div>
          <div style={{ fontSize: 9, color: PALETTE.cyan, marginBottom: 6 }}>CATIONS (+)</div>
          <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 12 }}>
            {tilePool.cats.map(c => {
              const isCorrect = c === q.cat.sym;
              const showCharge = char.charClass === 'alchemist';
              const ch = isCorrect ? q.cat.ch : 0;
              return (
                <button key={c} onClick={() => setPicked(p => ({ ...p, cat: c }))}
                  style={{
                    padding: 10, minWidth: 50, fontFamily: PIX_FONT, fontSize: 11,
                    background: picked.cat === c ? PALETTE.green : PALETTE.panel,
                    color: picked.cat === c ? PALETTE.bg : PALETTE.ink,
                    border: `3px solid ${PALETTE.bg}`, cursor: 'pointer',
                  }}>
                  {c}{showCharge && isCorrect ? <sup style={{ color: PALETTE.yellow }}>+{ch}</sup> : ''}
                </button>
              );
            })}
          </div>

          <div style={{ fontSize: 9, color: PALETTE.cyan, marginBottom: 6 }}>ANIONS (−)</div>
          <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 12 }}>
            {tilePool.ans.map(a => {
              const isCorrect = a === q.an.sym;
              const showCharge = char.charClass === 'alchemist';
              const ch = isCorrect ? q.an.ch : 0;
              return (
                <button key={a} onClick={() => setPicked(p => ({ ...p, an: a }))}
                  style={{
                    padding: 10, minWidth: 50, fontFamily: PIX_FONT, fontSize: 11,
                    background: picked.an === a ? PALETTE.cyan : PALETTE.panel,
                    color: picked.an === a ? PALETTE.bg : PALETTE.ink,
                    border: `3px solid ${PALETTE.bg}`, cursor: 'pointer',
                  }}>
                  {a}{showCharge && isCorrect ? <sup style={{ color: PALETTE.yellow }}>{ch}</sup> : ''}
                </button>
              );
            })}
          </div>

          <PixelButton onClick={handleBuildSubmit} disabled={!picked.cat || !picked.an} color={PALETTE.pink} full>
            Submit
          </PixelButton>
        </div>
      )}

      {!feedback && mode === 'name' && (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          {nameOptions.map(opt => (
            <button key={opt} onClick={() => handleAnswer(opt === q.n)} disabled={opt === eliminated}
              style={{
                padding: 14, fontFamily: PIX_FONT, fontSize: 11,
                background: opt === eliminated ? PALETTE.dim : PALETTE.panel,
                color: PALETTE.ink, border: `3px solid ${PALETTE.bg}`, cursor: opt === eliminated ? 'not-allowed' : 'pointer',
                textAlign: 'left', textDecoration: opt === eliminated ? 'line-through' : 'none',
                opacity: opt === eliminated ? 0.4 : 1,
              }}>
              {opt}{opt === eliminated && ' (eliminated)'}
            </button>
          ))}
        </div>
      )}

      {feedback && (
        <PixelPanel style={{ background: feedback.type === 'correct' ? PALETTE.green : PALETTE.red,
          color: PALETTE.bg, marginTop: 10, textAlign: 'center' }}>
          <div style={{ fontSize: 16, marginBottom: 8 }}>
            {feedback.type === 'correct' ? `✓ +${feedback.pts}` : '✗ INCORRECT'}
          </div>
          {feedback.type === 'correct' ? (
            <div style={{ fontSize: 9 }}>{q.f} = {q.n}</div>
          ) : (
            <div style={{ fontSize: 9 }}>Answer: {q.n} ({q.f})</div>
          )}
          <div style={{ marginTop: 12 }}>
            <PixelButton onClick={next} color={PALETTE.bg} small style={{ color: PALETTE.ink, background: PALETTE.bg }}>
              {qi + 1 >= questions.length || lives === 0 ? 'Finish' : 'Next ▶'}
            </PixelButton>
          </div>
        </PixelPanel>
      )}

      <BattleScene char={char} phase={arenaPhase} monster={monster} attackTier={attackTier} accentColor={PALETTE.cyan} />
    </div>
  );
}

// =================== COVALENT GAME ===================
function CovalentGame({ char, level, onWin, setRefOpen }) {
  const startLives = char.charClass === 'strategist' ? 4 : 3;
  const [questions] = useState(() => shuffle(COVALENT).slice(0, 8));
  const [qi, setQi] = useState(0);
  const [lives, setLives] = useState(startLives);
  const [score, setScore] = useState(0);
  const [streak, setStreak] = useState(0);
  const [feedback, setFeedback] = useState(null);
  const [eliminated, setEliminated] = useState(null);
  const [attackTier, setAttackTier] = useState(0);

  const q = questions[qi];
  const arenaPhase = useArenaPhase(qi, feedback, attackTier);

  const monsters = React.useMemo(() =>
    questions.map((_, i) => generateMonster(i === questions.length - 1, WORLD_PALETTES.covalent, i + level * 200))
  , [questions, level]);
  const monster = monsters[qi];

  // Build correct name
  const buildName = (e1, c1, e2, c2) => {
    const p1 = c1 === 1 ? '' : PREFIXES[c1 - 1] + '';
    const p2 = PREFIXES[c2 - 1];
    const root1 = FIRST_NAMES[e1] || e1;
    const root2 = ELEMENT_SUFFIX[e2] || e2;
    // contraction: a-o → o, e-o → o; tetra-oxide stays "tetroxide" (we keep simple)
    let prefix2 = p2;
    let root2Final = root2;
    if ((p2.endsWith('a') || p2.endsWith('o')) && /^[oa]/i.test(root2)) {
      prefix2 = p2.slice(0, -1);
    }
    return `${p1 ? p1 : ''}${root1} ${prefix2}${root2Final}`.replace(/\s+/g, ' ').trim();
  };

  const correctName = q ? buildName(q.e1, q.c1, q.e2, q.c2) : '';

  // Build distractors
  const nameOptions = React.useMemo(() => {
    if (!q) return [];
    const others = shuffle(COVALENT.filter(x => x.f !== q.f)).slice(0, 3)
      .map(o => buildName(o.e1, o.c1, o.e2, o.c2));
    return shuffle([correctName, ...others]);
  }, [qi]);

  useEffect(() => {
    if (char.charClass === 'scholar') {
      const wrongs = nameOptions.filter(o => o !== correctName);
      setEliminated(wrongs[0]);
    } else {
      setEliminated(null);
    }
    setFeedback(null);
  }, [qi]);

  if (!q) return null;

  const mode = level === 0 ? 'fname' : 'nformula'; // formula→name, or name→formula

  const handleAnswer = (correct) => {
    setAttackTier(Math.min(streak, 7));
    if (correct) {
      let pts = 100 + streak * 10;
      if (char.charClass === 'scholar') pts = Math.round(pts * 1.1);
      setScore(s => s + pts);
      setStreak(s => s + 1);
      setFeedback({ type: 'correct', pts });
    } else {
      setLives(l => l - 1);
      setStreak(0);
      setFeedback({ type: 'wrong' });
    }
  };

  const next = () => {
    if (lives <= 0) { onWin({ won: false, score, streak }); return; }
    if (qi + 1 >= questions.length) {
      onWin({ won: true, score, streak });
    } else {
      setQi(qi + 1);
    }
  };

  // For name→formula mode
  const [c1Pick, setC1Pick] = useState(1);
  const [c2Pick, setC2Pick] = useState(1);
  useEffect(() => { setC1Pick(1); setC2Pick(1); }, [qi]);

  return (
    <div style={{ minHeight: '100vh', padding: 10, paddingBottom: 80 }}>
      <GameHud char={char} lives={lives} maxLives={startLives} score={score} streak={streak}
        onQuit={() => onWin({ won: false, score, streak, quit: true })}
        onRef={() => setRefOpen(true)} />

      <PixelPanel style={{ marginBottom: 10, background: PALETTE.bg2 }}>
        <div style={{ fontSize: 9, color: PALETTE.cyan, marginBottom: 8 }}>
          Q{qi + 1}/{questions.length} · {mode === 'fname' ? '🔤 NAME THE FORMULA' : '🧪 BUILD THE FORMULA'}
        </div>
        {mode === 'fname' ? (
          <NeonText color={PALETTE.yellow} size={28}>{q.f}</NeonText>
        ) : (
          <NeonText color={PALETTE.yellow} size={16}>{correctName}</NeonText>
        )}
      </PixelPanel>

      {!feedback && mode === 'fname' && (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          {nameOptions.map(opt => (
            <button key={opt} onClick={() => handleAnswer(opt === correctName)} disabled={opt === eliminated}
              style={{
                padding: 14, fontFamily: PIX_FONT, fontSize: 10,
                background: opt === eliminated ? PALETTE.dim : PALETTE.panel,
                color: PALETTE.ink, border: `3px solid ${PALETTE.bg}`, cursor: opt === eliminated ? 'not-allowed' : 'pointer',
                textAlign: 'left', opacity: opt === eliminated ? 0.4 : 1,
              }}>
              {opt}{opt === eliminated && ' ✗'}
            </button>
          ))}
        </div>
      )}

      {!feedback && mode === 'nformula' && (
        <div>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, marginBottom: 14 }}>
            <div style={{ textAlign: 'center' }}>
              <div style={{ fontFamily: PIX_FONT, fontSize: 24, color: PALETTE.ink }}>
                {q.e1}<sub>{c1Pick === 1 ? '' : c1Pick}</sub>{q.e2}<sub>{c2Pick === 1 ? '' : c2Pick}</sub>
              </div>
            </div>
          </div>
          <div style={{ display: 'flex', gap: 12, justifyContent: 'center', marginBottom: 14 }}>
            <div style={{ textAlign: 'center' }}>
              <div style={{ fontSize: 9, color: PALETTE.cyan, marginBottom: 4 }}>{q.e1} count</div>
              <div style={{ display: 'flex', gap: 4, alignItems: 'center' }}>
                <PixelButton onClick={() => setC1Pick(Math.max(1, c1Pick - 1))} small color={PALETTE.dim} style={{ padding: '6px 10px' }}>−</PixelButton>
                <span style={{ fontFamily: PIX_FONT, fontSize: 16, color: PALETTE.yellow, minWidth: 24, textAlign: 'center' }}>{c1Pick}</span>
                <PixelButton onClick={() => setC1Pick(c1Pick + 1)} small color={PALETTE.green} style={{ padding: '6px 10px' }}>+</PixelButton>
              </div>
            </div>
            <div style={{ textAlign: 'center' }}>
              <div style={{ fontSize: 9, color: PALETTE.cyan, marginBottom: 4 }}>{q.e2} count</div>
              <div style={{ display: 'flex', gap: 4, alignItems: 'center' }}>
                <PixelButton onClick={() => setC2Pick(Math.max(1, c2Pick - 1))} small color={PALETTE.dim} style={{ padding: '6px 10px' }}>−</PixelButton>
                <span style={{ fontFamily: PIX_FONT, fontSize: 16, color: PALETTE.yellow, minWidth: 24, textAlign: 'center' }}>{c2Pick}</span>
                <PixelButton onClick={() => setC2Pick(c2Pick + 1)} small color={PALETTE.green} style={{ padding: '6px 10px' }}>+</PixelButton>
              </div>
            </div>
          </div>
          <PixelButton onClick={() => handleAnswer(c1Pick === q.c1 && c2Pick === q.c2)} color={PALETTE.pink} full>Submit</PixelButton>
        </div>
      )}

      {feedback && (
        <PixelPanel style={{ background: feedback.type === 'correct' ? PALETTE.green : PALETTE.red,
          color: PALETTE.bg, marginTop: 10, textAlign: 'center' }}>
          <div style={{ fontSize: 16, marginBottom: 8 }}>{feedback.type === 'correct' ? `✓ +${feedback.pts}` : '✗ INCORRECT'}</div>
          <div style={{ fontSize: 9 }}>{q.f} = {correctName}</div>
          <div style={{ marginTop: 12 }}>
            <PixelButton onClick={next} color={PALETTE.bg} small style={{ background: PALETTE.bg, color: PALETTE.ink }}>
              {qi + 1 >= questions.length || lives === 0 ? 'Finish' : 'Next ▶'}
            </PixelButton>
          </div>
        </PixelPanel>
      )}

      <BattleScene char={char} phase={arenaPhase} monster={monster} attackTier={attackTier} accentColor={PALETTE.green} />
    </div>
  );
}

// =================== EQUATION GAME ===================
function EquationGame({ char, level, onWin, setRefOpen }) {
  const startLives = char.charClass === 'strategist' ? 4 : 3;
  const pool = [EQUATIONS.synthesis, EQUATIONS.decomposition, EQUATIONS.single, EQUATIONS.double, EQUATIONS.combustion][level];
  const [questions] = useState(() => shuffle(pool).slice(0, Math.min(4, pool.length)));
  const [qi, setQi] = useState(0);
  const [lives, setLives] = useState(startLives);
  const [score, setScore] = useState(0);
  const [streak, setStreak] = useState(0);
  const [feedback, setFeedback] = useState(null);
  const [coefs, setCoefs] = useState({ r: [], p: [] });
  const [attempts, setAttempts] = useState(0);
  const [attackTier, setAttackTier] = useState(0);

  const q = questions[qi];
  const arenaPhase = useArenaPhase(qi, feedback, attackTier);

  const monsters = React.useMemo(() =>
    questions.map((_, i) => generateMonster(i === questions.length - 1, WORLD_PALETTES.equation, i + level * 300))
  , [questions, level]);
  const monster = monsters[qi];

  useEffect(() => {
    if (q) {
      setCoefs({ r: q.r.map(() => 1), p: q.p.map(() => 1) });
      setFeedback(null);
      setAttempts(0);
    }
  }, [qi]);

  if (!q) return null;

  const reactantsState = q.r.map((m, i) => ({ ...m, c: coefs.r[i] || 1 }));
  const productsState = q.p.map((m, i) => ({ ...m, c: coefs.p[i] || 1 }));
  const balanced = isBalanced(reactantsState, productsState);
  const rCounts = atomCount(reactantsState);
  const pCounts = atomCount(productsState);
  const allEls = Array.from(new Set([...Object.keys(rCounts), ...Object.keys(pCounts)])).sort();

  const setCoef = (side, idx, delta) => {
    setCoefs(c => ({
      ...c,
      [side]: c[side].map((v, i) => i === idx ? Math.max(1, Math.min(20, v + delta)) : v),
    }));
  };

  const submit = () => {
    setAttempts(a => a + 1);
    setAttackTier(Math.min(streak, 7));
    const correctCoefs = coefs.r.every((v, i) => v === q.r[i].c) && coefs.p.every((v, i) => v === q.p[i].c);
    if (balanced && correctCoefs) {
      let pts = 150 + streak * 10 - attempts * 20;
      pts = Math.max(50, pts);
      setScore(s => s + pts);
      setStreak(s => s + 1);
      setFeedback({ type: 'correct', pts });
    } else if (balanced) {
      // Balanced but maybe with multiples — accept if minimally balanced
      let pts = 100 + streak * 10 - attempts * 20;
      pts = Math.max(40, pts);
      setScore(s => s + pts);
      setStreak(s => s + 1);
      setFeedback({ type: 'correct', pts, note: 'Balanced (try lowest whole numbers next time).' });
    } else {
      setLives(l => l - 1);
      setStreak(0);
      setFeedback({ type: 'wrong' });
    }
  };

  const next = () => {
    if (lives <= 0) { onWin({ won: false, score, streak }); return; }
    if (qi + 1 >= questions.length) {
      onWin({ won: true, score, streak });
    } else {
      setQi(qi + 1);
    }
  };

  const showHints = char.charClass === 'strategist';

  const renderMolecules = (side, list, sideKey) => (
    <div style={{ display: 'flex', flexWrap: 'wrap', alignItems: 'center', gap: 6, justifyContent: 'center' }}>
      {list.map((m, i) => (
        <div key={i} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 2 }}>
            <span style={{ fontFamily: PIX_FONT, fontSize: 14, color: PALETTE.yellow, minWidth: 18, textAlign: 'right' }}>
              {coefs[sideKey][i]}
            </span>
            <span style={{ fontFamily: PIX_FONT, fontSize: 14, color: PALETTE.ink }}>{m.f}</span>
          </div>
          <div style={{ display: 'flex', gap: 2 }}>
            <button onClick={() => setCoef(sideKey, i, -1)} disabled={!!feedback}
              style={{ padding: '2px 6px', fontFamily: PIX_FONT, fontSize: 10, background: PALETTE.dim, color: PALETTE.ink, border: `2px solid ${PALETTE.bg}`, cursor: 'pointer' }}>−</button>
            <button onClick={() => setCoef(sideKey, i, 1)} disabled={!!feedback}
              style={{ padding: '2px 6px', fontFamily: PIX_FONT, fontSize: 10, background: PALETTE.green, color: PALETTE.bg, border: `2px solid ${PALETTE.bg}`, cursor: 'pointer' }}>+</button>
          </div>
          {i < list.length - 1 && <span style={{ position: 'absolute', display: 'none' }}>+</span>}
        </div>
      )).reduce((prev, curr, i) => i === 0 ? [curr] : [...prev, <span key={'p' + i} style={{ fontFamily: PIX_FONT, fontSize: 16, color: PALETTE.cyan }}>+</span>, curr], [])}
    </div>
  );

  return (
    <div style={{ minHeight: '100vh', padding: 10, paddingBottom: 80 }}>
      <GameHud char={char} lives={lives} maxLives={startLives} score={score} streak={streak}
        onQuit={() => onWin({ won: false, score, streak, quit: true })}
        onRef={() => setRefOpen(true)} />

      <PixelPanel style={{ marginBottom: 10, background: PALETTE.bg2 }}>
        <div style={{ fontSize: 9, color: PALETTE.cyan, marginBottom: 8 }}>
          Q{qi + 1}/{questions.length} · ⚖️ BALANCE THE EQUATION
        </div>

        <div style={{ marginBottom: 12 }}>
          {renderMolecules('reactants', reactantsState, 'r')}
          <div style={{ textAlign: 'center', fontFamily: PIX_FONT, fontSize: 18, color: PALETTE.pink, margin: '8px 0' }}>→</div>
          {renderMolecules('products', productsState, 'p')}
        </div>

        {/* Atom counter */}
        <div style={{ background: PALETTE.bg, padding: 8, border: `2px solid ${PALETTE.cyan}` }}>
          <div style={{ fontSize: 8, color: PALETTE.cyan, marginBottom: 6 }}>ATOM COUNTER</div>
          <table style={{ width: '100%', fontFamily: PIX_FONT, fontSize: 9 }}>
            <thead><tr style={{ color: PALETTE.dim }}><th></th><th>L</th><th>R</th></tr></thead>
            <tbody>
              {allEls.map(el => {
                const l = rCounts[el] || 0, r = pCounts[el] || 0;
                const eq = l === r;
                let cellColor = PALETTE.ink;
                if (showHints && !eq) cellColor = l < r ? PALETTE.red : PALETTE.cyan;
                return (
                  <tr key={el} style={{ color: eq ? PALETTE.green : cellColor }}>
                    <td style={{ padding: '2px 6px' }}>{el}</td>
                    <td style={{ padding: '2px 6px', textAlign: 'center' }}>{l}</td>
                    <td style={{ padding: '2px 6px', textAlign: 'center' }}>{r} {eq ? '✓' : '✗'}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          {balanced && <div style={{ marginTop: 6, color: PALETTE.green, fontFamily: PIX_FONT, fontSize: 10, textAlign: 'center' }}>✓ BALANCED</div>}
        </div>
      </PixelPanel>

      {!feedback && (
        <PixelButton onClick={submit} color={balanced ? PALETTE.green : PALETTE.pink} full>Submit</PixelButton>
      )}

      {feedback && (
        <PixelPanel style={{ background: feedback.type === 'correct' ? PALETTE.green : PALETTE.red,
          color: PALETTE.bg, marginTop: 10, textAlign: 'center' }}>
          <div style={{ fontSize: 16, marginBottom: 8 }}>{feedback.type === 'correct' ? `✓ +${feedback.pts}` : '✗ NOT BALANCED'}</div>
          {feedback.note && <div style={{ fontSize: 8, marginBottom: 6 }}>{feedback.note}</div>}
          <div style={{ fontSize: 9 }}>
            Lowest answer: {q.r.map(m => `${m.c === 1 ? '' : m.c}${m.f}`).join(' + ')} → {q.p.map(m => `${m.c === 1 ? '' : m.c}${m.f}`).join(' + ')}
          </div>
          <div style={{ marginTop: 12 }}>
            <PixelButton onClick={next} color={PALETTE.bg} small style={{ background: PALETTE.bg, color: PALETTE.ink }}>
              {qi + 1 >= questions.length || lives === 0 ? 'Finish' : 'Next ▶'}
            </PixelButton>
          </div>
        </PixelPanel>
      )}

      <BattleScene char={char} phase={arenaPhase} monster={monster} attackTier={attackTier} accentColor={PALETTE.pink} />
    </div>
  );
}

// =================== RESULT SCREEN ===================
const ENCOURAGE = [
  "Stoichiometry's in your blood!",
  "Mendeleev would be proud.",
  "Beakers bow to you.",
  "The lab notebook trembles in respect.",
  "Even atoms can't slow you down.",
];
const COMFORT = [
  "Marie Curie failed plenty too. Try again!",
  "Even atoms split sometimes. Reset!",
  "The periodic table is patient. So am I.",
  "One more shot — you're closer than you think.",
];

function ResultScreen({ result, char, world, level, onMap, onRetry }) {
  const stars = result.won ? (result.score >= 600 ? 3 : result.score >= 350 ? 2 : 1) : 0;
  const isWin = result.won;
  const msg = isWin ? ENCOURAGE[Math.floor(Math.random() * ENCOURAGE.length)]
                    : COMFORT[Math.floor(Math.random() * COMFORT.length)];
  return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column',
      alignItems: 'center', justifyContent: 'center', padding: 16, gap: 16 }}>
      <NeonText color={isWin ? PALETTE.yellow : PALETTE.red} size={24}>
        {isWin ? 'STAGE CLEAR!' : 'GAME OVER'}
      </NeonText>

      {isWin && (
        <div style={{ display: 'flex', gap: 8 }}>
          {[1, 2, 3].map(i => (
            <span key={i} style={{ fontSize: 48, filter: stars >= i ? 'drop-shadow(0 0 12px gold)' : 'grayscale(1) opacity(0.3)' }}>⭐</span>
          ))}
        </div>
      )}

      <Sprite char={char} expression={isWin ? 'thrilled' : 'sad'} size={140} />

      <SpeechBubble char={char} text={msg} />

      <PixelPanel style={{ width: '100%', maxWidth: 320, textAlign: 'center' }}>
        <div style={{ fontSize: 11, color: PALETTE.yellow, marginBottom: 8 }}>SCORE: {result.score}</div>
        <div style={{ fontSize: 9, color: PALETTE.cyan }}>BEST STREAK: {result.streak}🔥</div>
      </PixelPanel>

      <div style={{ display: 'flex', gap: 8 }}>
        <PixelButton onClick={onRetry} color={PALETTE.pink}>↻ Retry</PixelButton>
        <PixelButton onClick={onMap} color={PALETTE.green}>World Map ▶</PixelButton>
      </div>
    </div>
  );
}

// =================== MAIN APP ===================
const SAVE_KEY = 'chemquest:save:v1';

const initialSave = () => ({
  character: null,
  progress: {
    ionic: [0, 0, 0],
    covalent: [0, 0],
    equation: [0, 0, 0, 0, 0],
  },
  stats: { totalScore: 0, bestStreak: 0, levelsCompleted: 0 },
});

function ChemQuest() {
  const [save, setSave] = useState(initialSave());
  const [loaded, setLoaded] = useState(false);
  const [hasSave, setHasSave] = useState(false);
  const [screen, setScreen] = useState('title'); // title, create, map, play, result
  const [playState, setPlayState] = useState(null); // { world, level }
  const [result, setResult] = useState(null);
  const [refOpen, setRefOpen] = useState(false);

  // Load save
  useEffect(() => {
    (async () => {
      try {
        const r = await window.storage.get(SAVE_KEY);
        if (r && r.value) {
          const data = JSON.parse(r.value);
          setSave(data);
          setHasSave(!!data.character);
        }
      } catch (e) { /* no save */ }
      setLoaded(true);
    })();
  }, []);

  // Persist save
  const persist = useCallback(async (newSave) => {
    setSave(newSave);
    setHasSave(!!newSave.character);
    try {
      await window.storage.set(SAVE_KEY, JSON.stringify(newSave));
    } catch (e) {
      console.error('Save failed', e);
    }
  }, []);

  const startNew = () => setScreen('create');

  const continueGame = () => setScreen('map');

  const wipe = async () => {
    try { await window.storage.delete(SAVE_KEY); } catch(e) {}
    setSave(initialSave());
    setHasSave(false);
  };

  const onCharacterDone = async (char) => {
    const ns = { ...initialSave(), character: char };
    await persist(ns);
    setScreen('map');
  };

  const startLevel = (worldId, levelIdx) => {
    setPlayState({ world: worldId, level: levelIdx });
    setRefOpen(false);
    setScreen('play');
  };

  const onLevelEnd = async (res) => {
    setResult(res);
    if (res.won && !res.quit) {
      const stars = res.score >= 600 ? 3 : res.score >= 350 ? 2 : 1;
      const updatedProgress = { ...save.progress };
      const arr = [...updatedProgress[playState.world]];
      arr[playState.level] = Math.max(arr[playState.level], stars);
      updatedProgress[playState.world] = arr;
      const ns = {
        ...save,
        progress: updatedProgress,
        stats: {
          ...save.stats,
          totalScore: save.stats.totalScore + res.score,
          bestStreak: Math.max(save.stats.bestStreak, res.streak),
          levelsCompleted: save.stats.levelsCompleted + (save.progress[playState.world][playState.level] === 0 ? 1 : 0),
        },
      };
      await persist(ns);
    }
    if (res.quit) {
      setScreen('map');
    } else {
      setScreen('result');
    }
  };

  const retryLevel = () => {
    setRefOpen(false);
    setScreen('play');
  };

  if (!loaded) {
    return (
      <div style={{ minHeight: '100vh', background: PALETTE.bg, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <NeonText color={PALETTE.cyan} size={14}>LOADING…</NeonText>
      </div>
    );
  }

  return (
    <div style={{ background: PALETTE.bg, minHeight: '100vh', position: 'relative',
      backgroundImage: `radial-gradient(circle at 20% 20%, rgba(157,62,255,.3) 0, transparent 40%),
                        radial-gradient(circle at 80% 80%, rgba(62,240,255,.2) 0, transparent 40%)` }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        body { margin: 0; }
        sub, sup { font-size: 0.6em; }
        @keyframes walkBounce {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-3px); }
        }
        @keyframes walkIn {
          0% { transform: translateX(-160px); opacity: 0; }
          100% { transform: translateX(0); opacity: 1; }
        }
        @keyframes walkAway {
          0% { transform: translateX(0); }
          100% { transform: translateX(360px); opacity: 0.7; }
        }
        @keyframes attackLunge {
          0% { transform: translateX(0); }
          30% { transform: translateX(120px) translateY(-4px); }
          60% { transform: translateX(120px); }
          100% { transform: translateX(0); }
        }
        @keyframes hurtBounce {
          0% { transform: translateX(0); }
          15% { transform: translateX(40px) rotate(-3deg); }
          35% { transform: translateX(-25px) rotate(-10deg); }
          55% { transform: translateX(-15px) rotate(-5deg); }
          75% { transform: translateX(-25px) rotate(-8deg); }
          100% { transform: translateX(0) rotate(0); }
        }
        @keyframes monsterFloat {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-5px); }
        }
        @keyframes monsterShake {
          0%, 100% { transform: translateX(0); }
          25% { transform: translateX(-5px); }
          75% { transform: translateX(5px); }
        }
        @keyframes monsterDestroy {
          0% { transform: scale(1) rotate(0); opacity: 1; }
          40% { transform: scale(1.4) rotate(15deg); }
          100% { transform: scale(0) rotate(180deg); opacity: 0; }
        }
        @keyframes slashEffect {
          0% { transform: rotate(-25deg) scaleX(0); opacity: 0; }
          25% { transform: rotate(-25deg) scaleX(1); opacity: 1; }
          75% { transform: rotate(-25deg) scaleX(1); opacity: 1; }
          100% { transform: rotate(-25deg) scaleX(1.1); opacity: 0; }
        }
        @keyframes particleBurst {
          0% { transform: rotate(var(--deg)) translateX(0); opacity: 1; }
          100% { transform: rotate(var(--deg)) translateX(60px); opacity: 0; }
        }
        @keyframes fireballFly {
          0% { transform: translateX(0) scale(0.6); opacity: 0.8; }
          50% { transform: translateX(120px) scale(1.1); opacity: 1; }
          90% { transform: translateX(220px) scale(1.4); opacity: 1; }
          100% { transform: translateX(240px) scale(0.2); opacity: 0; }
        }
        @keyframes beamPulse {
          0% { transform: scaleX(0); opacity: 0; }
          15% { transform: scaleX(1); opacity: 1; }
          30%, 70% { transform: scaleX(1) scaleY(1.2); opacity: 1; }
          85% { transform: scaleX(1); opacity: 1; }
          100% { transform: scaleX(1); opacity: 0; }
        }
        @keyframes superFireSpin {
          from { transform: rotate(0) translateX(26px); }
          to { transform: rotate(360deg) translateX(26px); }
        }
        @keyframes meteorFall {
          0% { transform: translateY(-20px) translateX(0) rotate(0); opacity: 1; }
          85% { transform: translateY(140px) translateX(-20px) rotate(45deg); opacity: 1; }
          100% { transform: translateY(150px) translateX(-20px) rotate(60deg); opacity: 0; }
        }
        @keyframes shockwave {
          0% { transform: scale(0); opacity: 1; }
          100% { transform: scale(2.5); opacity: 0; }
        }
        @keyframes teleportOut {
          0% { transform: scale(1); opacity: 1; filter: brightness(1); }
          50% { transform: scale(1.1); opacity: 0.7; filter: brightness(3) blur(2px); }
          100% { transform: scale(0.3); opacity: 0; filter: brightness(5) blur(4px); }
        }
        @keyframes screenShake {
          0%, 100% { transform: translate(0, 0); }
          25% { transform: translate(-3px, 2px); }
          50% { transform: translate(2px, -2px); }
          75% { transform: translate(-2px, -1px); }
        }
        @keyframes streakFlash {
          0%, 100% { opacity: 0; transform: scaleX(0); }
          50% { opacity: 0.8; transform: scaleX(1); }
        }
        @keyframes swordSheath {
          0% { transform: translateX(-30px) rotate(15deg); opacity: 1; }
          70% { transform: translateX(0) rotate(0); opacity: 1; }
          100% { transform: translateX(20px) rotate(-10deg); opacity: 0; }
        }
        @keyframes cutFly {
          0% { transform: translate(0, 0) rotate(0); opacity: 1; }
          100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; }
        }
        @keyframes cutLineFlash {
          0% { opacity: 0; }
          30%, 70% { opacity: 1; }
          100% { opacity: 0; }
        }
        @keyframes ultimateLabel {
          0% { transform: translateX(-50%) scale(0); opacity: 0; }
          50% { transform: translateX(-50%) scale(1.3); opacity: 1; }
          100% { transform: translateX(-50%) scale(1); opacity: 1; }
        }
      `}</style>

      {screen === 'title' && (
        <TitleScreen hasSave={hasSave} onContinue={continueGame} onNew={startNew} onWipe={wipe} />
      )}
      {screen === 'create' && (
        <CharacterCreation onDone={onCharacterDone} />
      )}
      {screen === 'map' && save.character && (
        <WorldMap save={save} onPlay={startLevel} onTitle={() => setScreen('title')} />
      )}
      {screen === 'play' && playState && save.character && (
        <>
          {playState.world === 'ionic' && (
            <IonicGame char={save.character} level={playState.level} onWin={onLevelEnd} setRefOpen={setRefOpen} refOpen={refOpen} />
          )}
          {playState.world === 'covalent' && (
            <CovalentGame char={save.character} level={playState.level} onWin={onLevelEnd} setRefOpen={setRefOpen} />
          )}
          {playState.world === 'equation' && (
            <EquationGame char={save.character} level={playState.level} onWin={onLevelEnd} setRefOpen={setRefOpen} />
          )}
        </>
      )}
      {screen === 'result' && result && save.character && playState && (
        <ResultScreen result={result} char={save.character} world={playState.world} level={playState.level}
          onMap={() => setScreen('map')} onRetry={retryLevel} />
      )}

      <ReferenceSidebar open={refOpen} onClose={() => setRefOpen(false)} />
    </div>
  );
}


// Mount
const loader = document.getElementById('loader');
if (loader) loader.remove();
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ChemQuest />);
</script>
</body>
</html>
